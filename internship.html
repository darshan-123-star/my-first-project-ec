<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Product Catalog</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
        }

        /* Header / Navbar */
        header {
            background-color: #1a252f;
            color: #fff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.5rem;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-badge {
            background-color: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 0.8rem;
            position: absolute;
            top: -8px;
            right: -12px;
        }

        /* Controls Section (Search & Filter) */
        .controls {
            max-width: 1200px;
            margin: 2rem auto 1rem;
            padding: 0 1rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .controls input, .controls select {
            padding: 0.6rem 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
        }

        .controls input {
            flex: 1;
            min-width: 200px;
        }

        /* Product Grid */
        .catalog {
            max-width: 1200px;
            margin: 0 auto 3rem;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }

        .product-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        .product-category {
            font-size: 0.85rem;
            color: #7f8c8d;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #27ae60;
            margin-top: auto;
            margin-bottom: 1rem;
        }

        .add-to-cart-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: background-color 0.2s;
        }

        .add-to-cart-btn:hover {
            background-color: #2980b9;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #1a252f;
            color: #fff;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>StoreFront</h1>
        <div class="cart-icon">
            🛒 Cart <span class="cart-badge" id="cartCount">0</span>
        </div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search products..." onkeyup="filterProducts()">
        <select id="categoryFilter" onchange="filterProducts()">
            <option value="all">All Categories</option>
            <option value="electronics">Electronics</option>
            <option value="fashion">Fashion</option>
            <option value="home">Home & Kitchen</option>
        </select>
    </div>

    <main class="catalog" id="productCatalog">
        <!-- Product Cards will be dynamically generated by JavaScript -->
    </main>

    <footer>
        <p>&copy; 2026 StoreFront E-Commerce Catalog. All rights reserved.</p>
    </footer>

    <script>
        // Sample Product Data
        const products = [
            {
                id: 1,
                name: "Wireless Headphones",
                category: "electronics",
                price: 99.99,
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 2,
                name: "Smart Watch",
                category: "electronics",
                price: 149.99,
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 3,
                name: "Classic Denim Jacket",
                category: "fashion",
                price: 59.99,
                image: "https://images.unsplash.com/photo-1576995853123-5a10305d93c0?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 4,
                name: "Running Shoes",
                category: "fashion",
                price: 79.99,
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 5,
                name: "Ceramic Coffee Mug",
                category: "home",
                price: 14.99,
                image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 6,
                name: "Minimalist Desk Lamp",
                category: "home",
                price: 34.99,
                image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=500&auto=format&fit=crop&q=60"
            }
        ];

        let cartCount = 0;

        // Render Products to DOM
        function displayProducts(productList) {
            const catalog = document.getElementById("productCatalog");
            catalog.innerHTML = "";

            if (productList.length === 0) {
                catalog.innerHTML = "<p>No products found.</p>";
                return;
            }

            productList.forEach(product => {
                const card = document.createElement("div");
                card.classList.add("product-card");

                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <div class="product-info">
                        <span class="product-category">${product.category}</span>
                        <h2 class="product-title">${product.name}</h2>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <button class="add-to-cart-btn" onclick="addToCart()">Add to Cart</button>
                    </div>
                `;

                catalog.appendChild(card);
            });
        }

        // Filter Products by Search and Category
        function filterProducts() {
            const searchValue = document.getElementById("searchInput").value.toLowerCase();
            const categoryValue = document.getElementById("categoryFilter").value;

            const filtered = products.filter(product => {
                const matchesSearch = product.name.toLowerCase().includes(searchValue);
                const matchesCategory = categoryValue === "all" || product.category === categoryValue;
                return matchesSearch && matchesCategory;
            });

            displayProducts(filtered);
        }

        // Add to Cart Functionality
        function addToCart() {
            cartCount++;
            document.getElementById("cartCount").innerText = cartCount;
        }

        // Initial Load
        displayProducts(products);
    </script>
</body>
</html>
